
[project]
name = "khetmitra-ai"
version = "0.1.0"
description = "AI-powered farming decision support platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit",
    "python-dotenv",
    "pandas",
    "numpy",
    "pillow",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "imagehash>=4.3.2",
    "xgboost>=3.2.0",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
    "geopy>=2.5.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "faiss-cpu>=1.15.1",
    "sentence-transformers>=6.2.0",
    "pypdf>=6.21.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
